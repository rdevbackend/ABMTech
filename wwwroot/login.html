<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Técnico - ABM Tech</title>
    
    <!-- Bootstrap e FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS personalizado -->
    <link rel="stylesheet" href="style.css">

    <style>
        .login-card {
            background: rgba(13, 19, 36, 0.95);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 24px;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 40px rgba(0, 114, 255, 0.2);
        }

        .custom-form-control {
            background: #090d1a !important;
            border: 1px solid rgba(56, 189, 248, 0.3) !important;
            color: #ffffff !important;
            border-radius: 12px !important;
            padding: 12px 16px !important;
            transition: all 0.3s;
        }

        .custom-form-control:focus {
            border-color: #00f2fe !important;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.35) !important;
            background: #0d1326 !important;
        }

        .custom-form-control::placeholder {
            color: #94a3b8 !important;
            opacity: 1;
        }

        .btn-action-primary {
            background: linear-gradient(135deg, #0072ff 0%, #00f2fe 100%);
            color: #ffffff;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            padding: 12px;
            box-shadow: 0 4px 20px rgba(0, 114, 255, 0.4);
            transition: all 0.3s;
        }

        .btn-action-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 242, 254, 0.6);
            color: #ffffff;
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 50px;
            padding: 8px 20px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-back:hover {
            color: #00f2fe;
            border-color: #00f2fe;
            background: rgba(0, 242, 254, 0.1);
        }

        .text-subhead {
            color: #cbd5e1 !important;
        }
    </style>
</head>
<body>

<div class="container py-5 min-vh-100 d-flex flex-column justify-content-center align-items-center">
    <div class="col-md-6 col-lg-5 w-100" style="max-width: 450px;">
        <a href="index.html" class="btn btn-back mb-4 text-decoration-none d-inline-flex align-items-center">
            <i class="fa-solid fa-arrow-left me-2"></i>Voltar ao Início
        </a>
        
        <div class="card login-card p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="p-3 d-inline-block rounded-circle mb-3" style="background: rgba(0, 242, 254, 0.15); border: 1px solid rgba(0, 242, 254, 0.4);">
                    <i class="fa-solid fa-user-gear fa-2x" style="color: #00f2fe;"></i>
                </div>
                <h4 class="fw-bold text-white mb-1">Painel Técnico</h4>
                <p class="text-subhead small mb-0">Acesso restrito para colaboradores</p>
            </div>

            <form id="formLogin" onsubmit="fazerLogin(event)">
                <div class="mb-3">
                    <label class="form-label text-white fw-semibold">Usuário</label>
                    <input type="text" class="form-control custom-form-control" id="usuario" placeholder="Digite seu usuário" required>
                </div>
                <div class="mb-4">
                    <label class="form-label text-white fw-semibold">Senha</label>
                    <input type="password" class="form-control custom-form-control" id="senha" placeholder="Digite sua senha" required>
                </div>
                
                <button type="submit" class="btn btn-action-primary w-100 fw-bold">
                    <i class="fa-solid fa-right-to-bracket me-2"></i>Entrar no Painel
                </button>
            </form>

            <div id="msgErro" class="alert alert-danger d-none mt-3 text-center rounded-3 border-0 py-2 fs-6" role="alert"></div>
        </div>
    </div>
</div>

<script>
    function fazerLogin(event) {
        if (event) event.preventDefault();

        const user = document.getElementById('usuario').value.trim();
        const pass = document.getElementById('senha').value.trim();
        const msgErro = document.getElementById('msgErro');

        if (user === "admin" && pass === "12345") {
            window.location.href = "tecnico.html";
        } else {
            msgErro.classList.remove('d-none');
            msgErro.innerText = "Usuário ou senha incorretos!";
        }
    }
</script>

</body>
</html>
