<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar Status OS - ABM Tech</title>
    
    <!-- Bootstrap e FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS personalizado -->
    <link rel="stylesheet" href="style.css">

    <style>
        .status-card {
            background: rgba(13, 19, 36, 0.95);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 24px;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 40px rgba(0, 114, 255, 0.2);
        }

        /* Campo de texto de busca */
        .custom-form-control {
            background: #090d1a !important;
            border: 1px solid rgba(56, 189, 248, 0.3) !important;
            color: #ffffff !important;
            border-radius: 12px 0 0 12px !important;
            padding: 12px 16px !important;
            transition: all 0.3s;
        }

        .custom-form-control:focus {
            border-color: #00f2fe !important;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.35) !important;
            background: #0d1326 !important;
        }

        .custom-form-control::placeholder {
            color: #94a3b8 !important;
            opacity: 1;
        }

        /* Botão de Pesquisa */
        .btn-action-primary {
            background: linear-gradient(135deg, #0072ff 0%, #00f2fe 100%);
            color: #ffffff;
            border: none;
            border-radius: 0 12px 12px 0;
            font-weight: 700;
            padding: 12px 28px;
            box-shadow: 0 4px 20px rgba(0, 114, 255, 0.4);
            transition: all 0.3s;
        }

        .btn-action-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 242, 254, 0.6);
            color: #ffffff;
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 50px;
            padding: 8px 20px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-back:hover {
            color: #00f2fe;
            border-color: #00f2fe;
            background: rgba(0, 242, 254, 0.1);
        }

        .text-subhead {
            color: #cbd5e1 !important;
        }

        /* Caixa de Resultado */
        .result-box {
            background: #090d1a;
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 16px;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.15);
        }
    </style>
</head>
<body>

<div class="container py-5 min-vh-100 d-flex flex-column justify-content-center align-items-center">
    <div class="col-lg-7 col-md-9 w-100" style="max-width: 700px;">
        <a href="index.html" class="btn btn-back mb-4 text-decoration-none d-inline-flex align-items-center">
            <i class="fa-solid fa-arrow-left me-2"></i>Voltar ao Início
        </a>
        
        <div class="card status-card p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="p-3 d-inline-block rounded-circle mb-3" style="background: rgba(0, 242, 254, 0.15); border: 1px solid rgba(0, 242, 254, 0.4);">
                    <i class="fa-solid fa-magnifying-glass fa-2x" style="color: #00f2fe;"></i>
                </div>
                <h3 class="fw-bold text-white mb-1">Rastrear Ordem de Serviço</h3>
                <p class="text-subhead small mb-0">Insira o seu código para consultar o estado do seu aparelho</p>
            </div>

            <div class="input-group mb-3">
                <input type="text" id="codigoRastreio" class="form-control custom-form-control" placeholder="Ex: ABM-1234">
                <button type="button" onclick="consultarOS()" class="btn btn-action-primary">
                    <i class="fa-solid fa-search me-2"></i>Consultar
                </button>
            </div>

            <div id="resultadoRastreio" class="mt-4 p-4 result-box text-start d-none"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    async function consultarOS() {
        const codigoInput = document.getElementById('codigoRastreio');
        const codigo = codigoInput.value.trim();
        const resultadoDiv = document.getElementById('resultadoRastreio');

        if (!codigo) {
            alert('Por favor, digite um código de rastreio!');
            return;
        }

        try {
            const resposta = await fetch(`http://localhost:5176/api/OrdemServico/rastrear/${codigo}`);
            
            if (!resposta.ok) {
                throw new Error('OS não encontrada');
            }

            const os = await resposta.json();
            resultadoDiv.classList.remove('d-none');
            
            resultadoDiv.innerHTML = `
                <div class="d-flex justify-content-between align-items-center border-bottom border-secondary pb-3 mb-3">
                    <h5 class="fw-bold text-white mb-0">Detalhes do Agendamento</h5>
                    <span class="badge px-3 py-2 rounded-pill fs-6" style="background: rgba(0, 242, 254, 0.2); color: #00f2fe; border: 1px solid #00f2fe;">
                        ${os.status || 'Pendente'}
                    </span>
                </div>
                <div class="row g-2">
                    <div class="col-md-6">
                        <p class="text-subhead mb-1"><strong>Cliente:</strong> <span class="text-white">${os.nomeCliente}</span></p>
                    </div>
                    <div class="col-md-6">
                        <p class="text-subhead mb-1"><strong>Aparelho:</strong> <span class="text-white">${os.modeloAparelho}</span></p>
                    </div>
                    <div class="col-12 mt-2">
                        <p class="text-subhead mb-0"><strong>Defeito Relatado:</strong> <span class="text-white">${os.defeitoRelatado || 'Não informado'}</span></p>
                    </div>
                </div>
            `;
        } catch (err) {
            resultadoDiv.classList.remove('d-none');
            resultadoDiv.innerHTML = `
                <div class="text-center py-2">
                    <i class="fa-solid fa-circle-xmark fa-2x text-danger mb-2"></i>
                    <p class="text-subhead mb-0">Nenhuma Ordem de Serviço encontrada para o código <strong class="text-white">${codigo}</strong>.</p>
                </div>
            `;
        }
    }
</script>

</body>
</html>
