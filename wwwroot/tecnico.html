<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Técnico - ABM Tech</title>
    
    <!-- Bootstrap e FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS personalizado -->
    <link rel="stylesheet" href="style.css">

    <style>
        .panel-card {
            background: rgba(13, 19, 36, 0.95);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 20px;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 40px rgba(0, 114, 255, 0.15);
        }

        .table-dark-custom {
            --bs-table-bg: transparent;
            --bs-table-color: #f8fafc;
            border-color: rgba(56, 189, 248, 0.15);
        }

        .table-dark-custom th {
            color: #00f2fe;
            font-weight: 700;
            border-bottom: 2px solid rgba(56, 189, 248, 0.3);
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        .table-dark-custom td {
            vertical-align: middle;
            color: #e2e8f0;
        }

        .custom-select {
            background-color: #090d1a !important;
            border: 1px solid rgba(56, 189, 248, 0.3) !important;
            color: #00f2fe !important;
            border-radius: 8px !important;
            font-weight: 600;
        }

        .btn-action-primary {
            background: linear-gradient(135deg, #0072ff 0%, #00f2fe 100%);
            color: #ffffff;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            padding: 8px 20px;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.3);
            transition: all 0.3s;
        }

        .btn-action-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.5);
            color: #ffffff;
        }

        .btn-logout {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 50px;
            padding: 8px 20px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-logout:hover {
            background: rgba(239, 68, 68, 0.25);
            color: #f87171;
            border-color: #ef4444;
        }

        .text-subhead {
            color: #cbd5e1 !important;
        }
        .logo-ifood-style {
    height: 75px;                                  /* Tamanho grande e bem visível */
    width: auto;
    object-fit: contain;
    mix-blend-mode: screen;                        /* Oculta o fundo escuro do quadrado */
    filter: brightness(1.3) contrast(180%) drop-shadow(0 0 10px rgba(0, 242, 254, 0.6));
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
    border-radius: 0 !important;
    transition: transform 0.3s ease;
}

.logo-ifood-style:hover {
    transform: scale(1.06);
}
    </style>
</head>
<body>

<nav class="navbar navbar-custom sticky-top py-3">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center py-0 me-4" href="index.html">
    <img src="logo.png" alt="ABM Tech Store" class="logo-ifood-style" onerror="this.src='logo.png'">
</a>
        <div class="d-flex align-items-center gap-3">
            <span class="text-subhead d-none d-md-inline fw-semibold"><i class="fa-solid fa-user-check me-2 text-info"></i>Técnico Conectado</span>
            <a href="index.html" class="btn btn-logout text-decoration-none">
                <i class="fa-solid fa-right-from-bracket me-2"></i>Sair
            </a>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="row mb-4 align-items-center">
        <div class="col-md-8">
            <h3 class="fw-bold text-white mb-1">Gerenciamento de Ordens de Serviço</h3>
            <p class="text-subhead mb-0">Visualize, atualize os status e gerencie os agendamentos recebidos</p>
        </div>
        <div class="col-md-4 text-md-end mt-3 mt-md-0">
            <button onclick="carregarAgendamentos()" class="btn btn-action-primary">
                <i class="fa-solid fa-rotate me-2"></i>Atualizar Lista
            </button>
        </div>
    </div>

    <div class="card panel-card p-4">
        <div class="table-responsive">
            <table class="table table-dark-custom mb-0 align-middle">
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Cliente</th>
                        <th>WhatsApp</th>
                        <th>Aparelho</th>
                        <th>Defeito Relatado</th>
                        <th>Status Atual</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaAgendamentos">
                    <tr>
                        <td colspan="7" class="text-center text-subhead py-4">
                            <i class="fa-solid fa-spinner fa-spin me-2 text-info"></i>Carregando agendamentos...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", carregarAgendamentos);

    async function carregarAgendamentos() {
        const tabela = document.getElementById('tabelaAgendamentos');
        
        try {
            // URL corrigida para corresponder ao endpoint [HttpGet("todas")] do C#
            const resposta = await fetch('https://abmtech.onrender.com/api/OrdemServico/todas');
            if (!resposta.ok) throw new Error(`Erro HTTP ${resposta.status}`);

            const agendamentos = await resposta.json();

            if (!Array.isArray(agendamentos) || agendamentos.length === 0) {
                tabela.innerHTML = `
                    <tr>
                        <td colspan="7" class="text-center text-subhead py-4">
                            Nenhum agendamento cadastrado no sistema.
                        </td>
                    </tr>`;
                return;
            }

            tabela.innerHTML = agendamentos.map(os => `
                <tr>
                    <td><strong class="text-info">${os.codigoRastreio || ''}</strong></td>
                    <td class="fw-semibold text-white">${os.nomeCliente || ''}</td>
                    <td>
                        <a href="https://wa.me/55${os.whatsappCliente ? os.whatsappCliente.replace(/\D/g, '') : ''}" target="_blank" class="btn btn-sm btn-outline-success rounded-pill px-3">
                            <i class="fa-brands fa-whatsapp me-1"></i>${os.whatsappCliente || ''}
                        </a>
                    </td>
                    <td>${os.modeloAparelho || ''}</td>
                    <td><small class="text-subhead">${os.defeitoRelatado || 'Não informado'}</small></td>
                    <td>
                        <select onchange="atualizarOS(${os.id}, this.value, ${os.precoPeca || 0}, ${os.maoDeObra || 0})" class="form-select form-select-sm custom-select">
                            <option value="Agendado" ${os.status === 'Agendado' ? 'selected' : ''}>Agendado</option>
                            <option value="AguardandoAprovacao" ${os.status === 'AguardandoAprovacao' ? 'selected' : ''}>Aguardando Aprovação</option>
                            <option value="Aprovado" ${os.status === 'Aprovado' ? 'selected' : ''}>Aprovado</option>
                            <option value="EmAndamento" ${os.status === 'EmAndamento' ? 'selected' : ''}>Em Andamento</option>
                            <option value="TestesFinalizados" ${os.status === 'TestesFinalizados' ? 'selected' : ''}>Testes Finalizados</option>
                            <option value="ProntoParaRetirada" ${os.status === 'ProntoParaRetirada' ? 'selected' : ''}>Pronto para Retirada</option>
                            <option value="Entregue" ${os.status === 'Entregue' ? 'selected' : ''}>Entregue</option>
                            <option value="Cancelado" ${os.status === 'Cancelado' ? 'selected' : ''}>Cancelado</option>
                        </select>
                    </td>
                    <td>
                        <button onclick="notificarCliente('${os.whatsappCliente || ''}', '${os.nomeCliente || ''}', '${os.codigoRastreio || ''}', '${os.status || ''}')" class="btn btn-sm btn-outline-info rounded-circle" title="Notificar no WhatsApp">
                            <i class="fa-brands fa-whatsapp"></i>
                        </button>
                    </td>
                </tr>
            `).join('');

        } catch (err) {
            console.error("Erro ao carregar dados:", err);
            tabela.innerHTML = `
                <tr>
                    <td colspan="7" class="text-center text-danger py-4">
                        <i class="fa-solid fa-triangle-exclamation me-2"></i>Erro ao carregar agendamentos.
                    </td>
                </tr>`;
        }
    }

    async function atualizarOS(id, novoStatus, precoPeca, maoDeObra) {
        try {
            // URL corrigida para corresponder ao endpoint [HttpPut("atualizar/{id}")] do C#
            const resposta = await fetch(`/api/OrdemServico/atualizar/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    novoStatus: novoStatus,
                    precoPecaFornecedor: precoPeca,
                    valorMaoDeObra: maoDeObra
                })
            });

            if (!resposta.ok) throw new Error('Falha ao atualizar');
        } catch (err) {
            alert('Falha ao atualizar o status na API.');
            carregarAgendamentos();
        }
    }

    function notificarCliente(whatsapp, nome, codigo, status) {
        const num = whatsapp ? whatsapp.replace(/\D/g, '') : '';
        const mensagem = `Olá ${nome}! Atualização sobre o seu aparelho na ABM Tech (OS: ${codigo}): O status atual é *${status}*.`;
        window.open(`https://wa.me/55${num}?text=${encodeURIComponent(mensagem)}`, '_blank');
    }
</script>

</body>
</html>
