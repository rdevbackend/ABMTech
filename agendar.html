<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Serviço - ABM Tech</title>
    
    <!-- Bootstrap e FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <a href="index.html" class="btn btn-outline-light mb-4 rounded-pill px-4">
                <i class="fa-solid fa-arrow-left me-2"></i>Voltar ao Início
            </a>
            
            <div class="card card-dark p-4 p-md-5 shadow-lg">
                <h3 class="fw-bold mb-4 text-white">
                    <i class="fa-regular fa-calendar-check me-2 text-info"></i>Solicitar Agendamento
                </h3>
                
                <!-- Substituído <form> por <div> para eliminar o recarregamento nativo -->
                <div id="formAgendamento">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Seu Nome *</label>
                            <input type="text" class="form-control" id="nomeCliente" placeholder="Ex: João Silva" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">WhatsApp *</label>
                            <input type="text" class="form-control" id="whatsappCliente" placeholder="(16) 99999-9999" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Modelo do Aparelho *</label>
                            <input type="text" class="form-control" id="modeloAparelho" placeholder="Ex: iPhone 13, Galaxy A35" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Defeito Relatado / Observações</label>
                            <textarea class="form-control" id="defeitoRelatado" rows="3" placeholder="Descreva o problema do aparelho"></textarea>
                        </div>
                        <div class="col-12 mt-4">
                            <button type="button" onclick="enviarAgendamento()" class="btn btn-primary btn-lg w-100 fw-bold rounded-pill">
                                Enviar Agendamento no Sistema
                            </button>
                        </div>
                    </div>
                </div>

                <hr class="my-4 border-secondary">

                <div class="text-center">
                    <p class="text-light mb-2">Não sabe o defeito do seu celular?</p>
                    <button type="button" onclick="abrirWhatsapp()" class="btn btn-success fw-bold rounded-pill px-4 py-2">
                        <i class="fa-brands fa-whatsapp me-2"></i>Falar Direto com Técnico
                    </button>
                </div>

                <div id="resultadoAgendamento" class="mt-4 alert alert-success d-none rounded-3" role="alert"></div>
            </div>
        </div>
    </div>
</div>

<!-- MODAL DE ALERTA DO SITE -->
<div class="modal fade" id="modalAviso" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content modal-dark text-start">
            <div class="modal-header border-0">
                <h5 class="modal-title fw-bold" id="modalTitulo"></h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body text-light" id="modalMensagem"></div>
            <div class="modal-footer border-0">
                <button type="button" class="btn btn-secondary rounded-pill px-4" data-bs-dismiss="modal">Entendido</button>
            </div>
        </div>
    </div>
</div>

<!-- JS do Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function exibirModal(titulo, mensagem, tipo = 'warning') {
        const modalTitulo = document.getElementById('modalTitulo');
        const modalMensagem = document.getElementById('modalMensagem');
        
        modalTitulo.className = `modal-title fw-bold text-${tipo}`;
        modalTitulo.innerHTML = tipo === 'danger' 
            ? `<i class="fa-solid fa-circle-exclamation me-2"></i>${titulo}`
            : `<i class="fa-solid fa-triangle-exclamation me-2"></i>${titulo}`;
            
        modalMensagem.innerText = mensagem;
        
        const modal = new bootstrap.Modal(document.getElementById('modalAviso'));
        modal.show();
    }

    async function enviarAgendamento() {
        const nome = document.getElementById('nomeCliente').value.trim();
        const whatsapp = document.getElementById('whatsappCliente').value.trim();
        const modelo = document.getElementById('modeloAparelho').value.trim();
        const defeito = document.getElementById('defeitoRelatado').value.trim();

        if (!nome || !whatsapp || !modelo) {
            exibirModal(
                'Campos Obrigatórios', 
                'Por favor, preencha o seu Nome, WhatsApp e o Modelo do Aparelho antes de enviar.', 
                'warning'
            );
            return;
        }

        const dados = {
            nomeCliente: nome,
            whatsappCliente: whatsapp,
            modeloAparelho: modelo,
            defeitoRelatado: defeito
        };

        try {
            const resposta = await fetch('http://localhost:5176/api/OrdemServico/agendar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });

            if (!resposta.ok) throw new Error('Servidor retornou erro');

            const resultado = await resposta.json();
            const codigo = resultado.codigoRastreio || "Código Gerado";

            // Limpa os campos individualmente
            document.getElementById('nomeCliente').value = '';
            document.getElementById('whatsappCliente').value = '';
            document.getElementById('modeloAparelho').value = '';
            document.getElementById('defeitoRelatado').value = '';

            // Exibe e preenche a caixa do resultado
            const alertDiv = document.getElementById('resultadoAgendamento');
            alertDiv.classList.remove('d-none');
            alertDiv.innerHTML = `<strong>Sucesso!</strong> Guarde seu código de rastreio: <strong class="fs-5 text-dark">${codigo}</strong>`;

            // Rola até o código
            setTimeout(() => {
                alertDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 100);

        } catch (err) {
            exibirModal(
                'Falha na Conexão', 
                'Não foi possível conectar ao servidor. Verifique se a sua API em C# está rodando com "dotnet run".', 
                'danger'
            );
        }
    }

    function abrirWhatsapp() {
        const nome = document.getElementById('nomeCliente').value;
        const modelo = document.getElementById('modeloAparelho').value;
        const defeito = document.getElementById('defeitoRelatado').value;
        window.open(`https://wa.me/5516999999999?text=Olá, preciso de suporte! Nome: ${nome} | Modelo: ${modelo} | Defeito: ${defeito}`, '_blank');
    }
</script>

</body>
</html>
