<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Serviço - ABM Tech</title>
    
    <!-- Bootstrap e FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS personalizado -->
    <link rel="stylesheet" href="style.css">

    <style>
        /* Logo Estilo iFood / Cyberpunk (Sem fundo quadrado) */
        .logo-ifood-style {
            height: 75px;
            width: auto;
            object-fit: contain;
            mix-blend-mode: screen;
            filter: brightness(1.3) contrast(180%) drop-shadow(0 0 10px rgba(0, 242, 254, 0.6));
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            border-radius: 0 !important;
            transition: transform 0.3s ease;
        }

        .logo-ifood-style:hover {
            transform: scale(1.05);
        }

        .agendar-card {
            background: rgba(13, 19, 36, 0.95);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 24px;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 40px rgba(0, 114, 255, 0.2);
        }

        .custom-form-control {
            background: #090d1a !important;
            border: 1px solid rgba(56, 189, 248, 0.3) !important;
            color: #ffffff !important;
            border-radius: 12px !important;
            padding: 12px 16px !important;
            transition: all 0.3s;
        }

        .custom-form-control:focus {
            border-color: #00f2fe !important;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.35) !important;
            background: #0d1326 !important;
        }

        .custom-form-control::placeholder {
            color: #94a3b8 !important;
            opacity: 1;
        }

        .btn-action-primary {
            background: linear-gradient(135deg, #0072ff 0%, #00f2fe 100%);
            color: #ffffff;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            padding: 14px 28px;
            box-shadow: 0 4px 20px rgba(0, 114, 255, 0.4);
            transition: all 0.3s;
        }

        .btn-action-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 242, 254, 0.6);
            color: #ffffff;
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 50px;
            padding: 8px 20px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-back:hover {
            color: #00f2fe;
            border-color: #00f2fe;
            background: rgba(0, 242, 254, 0.1);
        }

        .text-subhead {
            color: #cbd5e1 !important;
        }

        .result-box {
            background: #090d1a;
            border: 1px solid #00f2fe;
            border-radius: 16px;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.25);
        }
    </style>
</head>
<body>

<!-- BARRA SUPERIOR COM LOGO -->
<nav class="navbar navbar-dark bg-dark-custom py-2 border-bottom border-secondary border-opacity-10 mb-4">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center py-0" href="index.html">
            <img src="logo.jpg" alt="ABM Tech Store" class="logo-ifood-style" onerror="this.src='logo.png'">
        </a>
    </div>
</nav>

<div class="container py-2 mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <a href="index.html" class="btn btn-back mb-4 text-decoration-none d-inline-flex align-items-center">
                <i class="fa-solid fa-arrow-left me-2"></i>Voltar ao Início
            </a>
            
            <div class="card agendar-card p-4 p-md-5">
                <div class="d-flex align-items-center mb-4">
                    <div class="p-3 rounded-circle me-3" style="background: rgba(0, 242, 254, 0.15); border: 1px solid rgba(0, 242, 254, 0.4);">
                        <i class="fa-regular fa-calendar-check fa-2x" style="color: #00f2fe;"></i>
                    </div>
                    <div>
                        <h3 class="fw-bold mb-1 text-white">Solicitar Agendamento</h3>
                        <p class="text-subhead small mb-0">Preencha os dados abaixo para gerar a sua Ordem de Serviço</p>
                    </div>
                </div>
                
                <div id="containerAgendamento">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label text-white fw-semibold">Seu Nome *</label>
                            <input type="text" class="form-control custom-form-control" id="nomeCliente" placeholder="Ex: João Silva">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-white fw-semibold">WhatsApp *</label>
                            <input type="text" 
                                   class="form-control custom-form-control" 
                                   id="whatsappCliente" 
                                   placeholder="(16) 99999-9999" 
                                   maxlength="15" 
                                   oninput="mascaraWhatsapp(this)">
                        </div>
                        <div class="col-12">
                            <label class="form-label text-white fw-semibold">Modelo do Aparelho *</label>
                            <input type="text" class="form-control custom-form-control" id="modeloAparelho" placeholder="Ex: iPhone 13, Galaxy A35">
                        </div>
                        <div class="col-12">
                            <label class="form-label text-white fw-semibold">Defeito Relatado / Observações</label>
                            <textarea class="form-control custom-form-control" id="defeitoRelatado" rows="3" placeholder="Descreva o problema do aparelho"></textarea>
                        </div>
                        <div class="col-12 mt-4">
                            <button type="button" id="btnEnviarOS" onclick="processarEnvio()" class="btn btn-action-primary btn-lg w-100">
                                <i class="fa-solid fa-paper-plane me-2"></i>Enviar Agendamento no Sistema
                            </button>
                        </div>
                    </div>
                </div>

                <hr class="my-4" style="border-color: rgba(56, 189, 248, 0.25);">

                <div class="text-center">
                    <p class="text-subhead fw-medium mb-3">Não sabe qual é o defeito do seu aparelho?</p>
                    <button type="button" onclick="abrirWhatsapp()" class="btn btn-outline-success rounded-pill px-4 py-2 text-decoration-none d-inline-flex align-items-center">
                        <i class="fa-brands fa-whatsapp me-2 fs-5"></i>Falar Direto com o Técnico
                    </button>
                </div>

                <div id="resultadoAgendamento" class="mt-4 p-4 result-box text-center d-none"></div>
            </div>
        </div>
    </div>
</div>

<!-- MODAL DE ALERTA -->
<div class="modal fade" id="modalAviso" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content text-start" style="background: #0d1324; border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 20px;">
            <div class="modal-header border-0">
                <h5 class="modal-title fw-bold" id="modalTitulo"></h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body text-light" id="modalMensagem"></div>
            <div class="modal-footer border-0">
                <button type="button" class="btn btn-action-primary rounded-pill px-4 py-2" data-bs-dismiss="modal">Entendido</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // MÁSCARA INTELIGENTE DE WHATSAPP
    function mascaraWhatsapp(input) {
        let valor = input.value.replace(/\D/g, ""); // Remove tudo que não é número

        if (valor.length > 11) valor = valor.slice(0, 11); // Limita em 11 números

        if (valor.length > 10) {
            input.value = valor.replace(/^(\d{2})(\d{5})(\d{4})\$/, "(\$1) \$2-\$3");
        } else if (valor.length > 6) {
            input.value = valor.replace(/^(\d{2})(\d{4,5})(\d{0,4})\$/, "(\$1) \$2-\$3");
        } else if (valor.length > 2) {
            input.value = valor.replace(/^(\d{2})(\d{0,5})\$/, "(\$1) \$2");
        } else {
            input.value = valor;
        }
    }

    function exibirModal(titulo, mensagem, tipo = 'warning') {
        const modalTitulo = document.getElementById('modalTitulo');
        const modalMensagem = document.getElementById('modalMensagem');
        
        modalTitulo.className = `modal-title fw-bold text-${tipo}`;
        modalTitulo.innerHTML = tipo === 'danger' 
            ? `<i class="fa-solid fa-circle-exclamation me-2"></i>${titulo}`
            : `<i class="fa-solid fa-triangle-exclamation me-2"></i>${titulo}`;
            
        modalMensagem.innerText = mensagem;
        
        const modal = new bootstrap.Modal(document.getElementById('modalAviso'));
        modal.show();
    }

    async function processarEnvio() {
        const nome = document.getElementById('nomeCliente').value.trim();
        const whatsapp = document.getElementById('whatsappCliente').value.trim();
        const modelo = document.getElementById('modeloAparelho').value.trim();
        const defeito = document.getElementById('defeitoRelatado').value.trim();

        // Extrai apenas os números para verificação
        const apenasNumerosWhatsapp = whatsapp.replace(/\D/g, "");

        if (!nome || !whatsapp || !modelo) {
            exibirModal(
                'Campos Obrigatórios', 
                'Por favor, preencha o seu Nome, WhatsApp e o Modelo do Aparelho antes de enviar.', 
                'warning'
            );
            return;
        }

        if (apenasNumerosWhatsapp.length < 11) {
            exibirModal(
                'WhatsApp Incompleto', 
                'Por favor, insira o número do WhatsApp completo com DDD e os 9 dígitos (ex: 16 99999-9999).', 
                'warning'
            );
            return;
        }

        const dados = {
            nomeCliente: nome,
            whatsappCliente: whatsapp,
            modeloAparelho: modelo,
            defeitoRelatado: defeito
        };

        try {
            const resposta = await fetch('http://localhost:5176/api/OrdemServico/agendar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });

            if (!resposta.ok) throw new Error('Erro ao salvar');

            const resultado = await resposta.json();
            const codigo = resultado.codigoRastreio || "Código Gerado";

            // Limpa os campos
            document.getElementById('nomeCliente').value = '';
            document.getElementById('whatsappCliente').value = '';
            document.getElementById('modeloAparelho').value = '';
            document.getElementById('defeitoRelatado').value = '';

            // Exibe resultado
            const alertDiv = document.getElementById('resultadoAgendamento');
            alertDiv.classList.remove('d-none');
            alertDiv.innerHTML = `
                <i class="fa-solid fa-circle-check fa-3x mb-3" style="color: #00f2fe;"></i>
                <h4 class="fw-bold text-white mb-2">Agendamento Solicitado com Sucesso!</h4>
                <p class="text-subhead mb-3">Guarde o seu código de rastreio para acompanhar o status:</p>
                <div class="d-inline-block px-4 py-2 rounded-pill fw-bold fs-3 mb-3" style="background: linear-gradient(135deg, #0072ff 0%, #00f2fe 100%); color: #fff;">
                    ${codigo}
                </div>
                <div>
                    <a href="status.html" class="btn btn-sm btn-outline-info rounded-pill px-3 py-2 mt-2 text-decoration-none">
                        <i class="fa-solid fa-magnifying-glass me-1"></i> Ir para a página de rastreio
                    </a>
                </div>
            `;

            setTimeout(() => {
                alertDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 100);

        } catch (err) {
            exibirModal(
                'Falha na Conexão', 
                'Não foi possível conectar ao servidor. Verifique se a sua API em C# está rodando com "dotnet run".', 
                'danger'
            );
        }
    }

    function abrirWhatsapp() {
        const nome = document.getElementById('nomeCliente').value;
        const modelo = document.getElementById('modeloAparelho').value;
        const defeito = document.getElementById('defeitoRelatado').value;
        window.open(`https://wa.me/5516991600449?text=Olá, preciso de suporte! Nome: ${nome} | Modelo: ${modelo} | Defeito: ${defeito}`, '_blank');
    }
</script>

</body>
</html>
