<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABM Tech - Login do Técnico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white vh-100 d-flex align-items-center justify-content-center">

    <div class="card bg-secondary text-white p-4 shadow-lg" style="max-width: 400px; width: 100%;">
        <div class="card-body">
            <h3 class="card-title text-center text-primary mb-4">ABM Tech</h3>
            <h5 class="card-subtitle text-center mb-4 text-light">Acesso Restrito ao Painel</h5>

            <form id="form-login" onsubmit="realizarLogin(event)">
                <div class="mb-3">
                    <label for="usuario" class="form-label">Usuário</label>
                    <input type="text" class="form-control" id="usuario" placeholder="Digite seu usuário" required>
                </div>
                <div class="mb-3">
                    <label for="senha" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="senha" placeholder="Digite sua senha" required>
                </div>
                
                <div id="msg-erro" class="alert alert-danger d-none py-2 text-center mt-3" role="alert">
                    Usuário ou senha inválidos!
                </div>

                <button type="submit" class="btn btn-primary w-100 mt-3">Entrar</button>
            </form>
        </div>
    </div>

    <script>
        function realizarLogin(event) {
            event.preventDefault();

            const usuarioInput = document.getElementById('usuario').value;
            const senhaInput = document.getElementById('senha').value;
            const msgErro = document.getElementById('msg-erro');

            // Credenciais simples de acesso (Pode alterar como preferir)
            const USUARIO_CORRETO = "admin";
            const SENHA_CORRETA = "12345";

            if (usuarioInput === USUARIO_CORRETO && senhaInput === SENHA_CORRETA) {
                // Guarda a sessão do técnico no navegador
                localStorage.setItem("abmtech_autenticado", "true");
                // Redireciona para o painel
                window.location.href = "./tecnico.html";
            } else {
                msgErro.classList.remove('d-none');
            }
        }
    </script>
</body>
</html>
